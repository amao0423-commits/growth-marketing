name: Auto-publish editorial post

on:
  schedule:
    # 週10回：平日(月〜金) 09:00と18:00 JST（= 00:00と09:00 UTC）。
    # topics.json の categoryRotation は5カテゴリ（sns/ads/seo/content/brand）を
    # 順送りするため、週10回＝各カテゴリちょうど2回ずつのローテーションになる。
    - cron: '0 0,9 * * 1-5'
  workflow_dispatch: {}   # 手動でもオンデマンド実行可能

permissions:
  contents: write   # content/topics.json（トピック消化状況の台帳）を commit & push する

concurrency:
  group: auto-publish
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      # Claude Code を入れて、Maxプランのサブスク課金（OAuthトークン）で記事生成する。
      # APIキー従量課金は使わない。トークンは `claude setup-token` で発行し、
      # GitHub Secrets の CLAUDE_CODE_OAUTH_TOKEN に登録しておく。
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Generate post
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # 任意: モデル指定（未指定ならClaude Code既定）。例: claude-sonnet-4-6 / claude-opus-4-8
          POST_MODEL: ${{ vars.POST_MODEL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          # Secretに改行/空白が混入していてもトークンとして使えるよう除去する
          export CLAUDE_CODE_OAUTH_TOKEN="$(printf '%s' "$CLAUDE_CODE_OAUTH_TOKEN" | tr -d '[:space:]')"
          npm run generate

      - name: Commit & push topic ledger if changed
        run: |
          if [ -n "$(git status --porcelain content/topics.json)" ]; then
            git config user.name "adpress-bot"
            git config user.email "bot@users.noreply.github.com"
            git add content/topics.json
            git commit -m "Auto-publish editorial post ($(date -u +%Y-%m-%d))"
            git pull --rebase origin main
            git push
          else
            echo "No topic ledger change — nothing to commit."
          fi
