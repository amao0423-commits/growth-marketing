name: Auto-publish SEO post

on:
  schedule:
    # 週2回：火・金 09:00 JST（= 00:00 UTC）。曜日/時刻は調整可。
    - cron: '0 0 * * 2'
    - cron: '0 0 * * 5'
  workflow_dispatch: {}   # 手動でもオンデマンド実行可能

permissions:
  contents: write   # 生成記事を commit & push する

concurrency:
  group: auto-publish
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '20'

      # Claude Code を入れて、Maxプランのサブスク課金（OAuthトークン）で記事生成する。
      # APIキー従量課金は使わない。トークンは `claude setup-token` で発行し、
      # GitHub Secrets の CLAUDE_CODE_OAUTH_TOKEN に登録しておく。
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Generate post
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # 任意: モデル指定（未指定ならClaude Code既定）。例: claude-sonnet-4-6 / claude-opus-4-8
          POST_MODEL: ${{ vars.POST_MODEL }}
        run: |
          # Secretに改行/空白が混入していてもトークンとして使えるよう除去する
          export CLAUDE_CODE_OAUTH_TOKEN="$(printf '%s' "$CLAUDE_CODE_OAUTH_TOKEN" | tr -d '[:space:]')"
          npm run generate

      - name: Commit & push if changed
        run: |
          if [ -n "$(git status --porcelain blog content sitemap.xml)" ]; then
            git config user.name "growth-marketing-bot"
            git config user.email "bot@users.noreply.github.com"
            git add blog content sitemap.xml
            git commit -m "Auto-publish SEO post ($(date -u +%Y-%m-%d))"
            git pull --rebase origin main
            git push
          else
            echo "No new post generated — nothing to commit."
          fi
